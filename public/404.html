<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deze stage bestaat niet | ZIJDN</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Shrikhand&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:#ffd6ec;color:#3a0634;
    font-family:"Bricolage Grotesque",system-ui,sans-serif;text-align:center;padding:2rem}
  .big{font-family:"Shrikhand",Georgia,serif;font-size:clamp(6rem,26vw,16rem);line-height:.9;margin:0;color:#ff2d95;
    text-shadow:.012em .012em 0 #3a0634,.024em .024em 0 #3a0634,.036em .036em 0 #3a0634}
  .ball{font-size:3.5rem;display:inline-block;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ball{animation:none}}
  h1{font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:-.03em;margin:.6rem 0 .4rem}
  p{margin:0 0 2rem;font-size:1.1rem}
  a{display:inline-block;padding:.9rem 1.5rem;border-radius:999px;border:2px solid #3a0634;background:#ff2d95;color:#3a0634;
    font-weight:700;text-decoration:none;box-shadow:4px 4px 0 #3a0634}
  a:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #3a0634}
  a:focus-visible{outline:3px solid #8a4dff;outline-offset:4px}
</style>
</head>
<body>
  <main>
    <span class="ball" aria-hidden="true">🪩</span>
    <p class="big" aria-hidden="true">404</p>
    <h1>Deze stage bestaat niet</h1>
    <p>De pagina die je zoekt staat niet in de running order.</p>
    <a href="/">Terug naar de homepage</a>
  </main>
</body>
</html>
